[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Files every archive carries besides the binary, README and LICENSE: shell
# completions and man pages in man/man1/ (see tests/generated.rs). The Homebrew
# formula puts them in the package's share directory, where man/ can go on
# MANPATH.
include = ["completions/", "man/"]
# Whether to install an updater program
install-updater = false
# A GitHub repo to push Homebrew formulas to
tap = "julio-romero/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew", "./publish-crates"]

[dist.github-custom-job-permissions]
"publish-crates" = { contents = "read" }

[dist.github-action-commits]
"actions/checkout" = "v7"

# GitHub retires the macos-14 image that dist 0.32 picks for Apple silicon
# (brownouts in October 2026, removed on November 2, 2026)
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
