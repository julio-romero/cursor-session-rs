[package]
name = "cursor-session"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "List, show, search, and export Cursor IDE and Agent CLI chat sessions, and hand one off to another agent"
license = "MIT"
repository = "https://github.com/julio-romero/cursor-session-rs"
homepage = "https://github.com/julio-romero/cursor-session-rs"
readme = "README.md"
keywords = ["cursor", "cli", "chat", "transcript", "export"]
categories = ["command-line-utilities"]
include = ["/src", "/README.md", "/LICENSE", "/tests/fixtures"]

[lib]
name = "cursor_session"
path = "src/lib.rs"

[[bin]]
name = "cursor-session"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6"
clap_mangen = "0.3"
comfy-table = "8"
crossterm = "0.29"
md-5 = "0.10"
owo-colors = "4"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_norway = "0.9"
thiserror = "2"
unicode-width = "0.2"

# macOS copies with /usr/bin/pbcopy, so that no command links AppKit.
[target.'cfg(not(target_os = "macos"))'.dependencies]
arboard = { version = "3.6", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
insta = "1"
predicates = "3"
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
strip = true
codegen-units = 1
